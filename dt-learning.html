<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technology Training Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* ── Mars Centra ─────────────────────────────────────────────
   Uses the font if it's installed on the device. For everyone else it loads the
   web font files from the Hub's Site Assets/fonts folder (update the URLs if they
   live elsewhere). Until they're uploaded the page falls back to Figtree. */
@font-face { font-family: "Mars Centra"; font-weight: 400; font-style: normal; font-display: swap;
  src: local("Mars Centra"), local("MarsCentra-Regular"), local("Mars Centra Regular"),
       url("https://team.effem.com/sites/MarsSnackingIntegrationLearningHub/SiteAssets/fonts/MarsCentra-Regular.woff2") format("woff2"); }
@font-face { font-family: "Mars Centra"; font-weight: 500; font-style: normal; font-display: swap;
  src: local("Mars Centra Medium"), local("MarsCentra-Medium"),
       url("https://team.effem.com/sites/MarsSnackingIntegrationLearningHub/SiteAssets/fonts/MarsCentra-Medium.woff2") format("woff2"); }
@font-face { font-family: "Mars Centra"; font-weight: 700; font-style: normal; font-display: swap;
  src: local("Mars Centra Bold"), local("MarsCentra-Bold"),
       url("https://team.effem.com/sites/MarsSnackingIntegrationLearningHub/SiteAssets/fonts/MarsCentra-Bold.woff2") format("woff2"); }

/* Layout: one compact, pinned filter bar (search + Persona / Workstream / Application dropdowns) → active-filter line →
   collapsible first steps → results. Everything that changes sits directly under the bar. Single light theme (white ground). */
:root {
  --bg: #FFFFFF;
  --ink: #3C3C3C;          /* Mars Dark Gray */
  --ink-soft: #6A6A78;
  --blue: #0000A0;         /* Mars Blue */
  --blue-deep: #00007A;
  --red: #F60B45;          /* Kellanova Red */
  --wblue: #009EEA;        /* Wrigley Blue */
  --orange: #FF8B00;       /* Snacking Orange */
  --mars-light: #BFBFF1;
  --kel-light: #FFCFF1;
  --wri-light: #CCEDFF;
  --snk-light: #FFE8CC;
  --line: #E2E2EF;
  --soft: #F5F5FC;
  --font: "Mars Centra", "MarsCentra", "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
/* Needed when hosted outside the preview (e.g. SharePoint): without it, elements with display:grid/flex ignore the hidden attribute. */
[hidden] { display: none !important; }
body { margin: 0; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.5; }
.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
h1, h2, h3 { font-family: var(--font); color: var(--blue); margin: 0; text-wrap: balance; }
h1 { font-size: 34px; line-height: 1.15; font-weight: 700; }
h2 { font-size: 22px; font-weight: 700; }
h3 { font-size: 19px; font-weight: 700; line-height: 1.3; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--wblue); outline-offset: 2px; border-radius: 8px; }

/* ── Title row ── */
.title-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 12px; }
.try { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 15px; color: var(--ink-soft); }
.try button { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 4px 13px; cursor: pointer; color: var(--blue); font-weight: 500; }
.try button:hover { border-color: var(--blue); }

/* ── Filter bar ── */
.bar-wrap { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); padding-block: 8px; margin-inline: -4px; padding-inline: 4px; }
.bar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.search { grid-column: 1 / -1; }
.search { position: relative; display: block; min-width: 0; }
.search .s-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--blue); pointer-events: none; }
.search input {
  width: 100%; height: 64px; border: 2px solid var(--blue); border-radius: 16px; background: var(--bg);
  padding: 0 50px 0 56px; font-size: 19px; color: var(--ink); box-shadow: 0 4px 16px rgba(0, 0, 160, .10);
}
.search input::placeholder { color: #8C8CA6; }
.search input:focus { outline: none; box-shadow: 0 0 0 4px var(--mars-light); }
.search input::-webkit-search-cancel-button { display: none; }
.s-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--soft); color: var(--blue); cursor: pointer; display: grid; place-items: center; }

.dd { position: relative; min-width: 0; }
.dd-btn {
  width: 100%; height: 64px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--bg); cursor: pointer;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 0 14px 0 9px; text-align: left;
  transition: border-color .15s, background .15s;
}
.dd-btn:hover { border-color: var(--blue); }
.dd-btn[aria-expanded="true"] { border-color: var(--blue); box-shadow: 0 0 0 3px var(--mars-light); }
.dd-ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--soft); color: var(--blue); }
.dd-txt { min-width: 0; line-height: 1.2; }
.dd-label { display: block; font-size: 12.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dd-val { display: block; font-size: 17px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dd-chev { color: var(--blue); transition: transform .15s; }
.dd-btn[aria-expanded="true"] .dd-chev { transform: rotate(180deg); }
.dd.active .dd-btn { border-color: var(--blue); background: var(--soft); }
.dd.active .dd-val { color: var(--blue); }

.dd-menu {
  position: absolute; top: calc(100% + 6px); left: 0; width: max(100%, 340px); max-height: min(62vh, 440px); overflow-y: auto;
  background: var(--bg); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 36px rgba(0, 0, 60, .18);
  padding: 6px; display: grid; gap: 2px; z-index: 40;
}
.dd:last-child .dd-menu { left: auto; right: 0; }
.dd-menu { overscroll-behavior: contain; }
.dd-menu.up { top: auto; bottom: calc(100% + 6px); }
.dd-menu.cols { grid-template-columns: 1fr 1fr; width: max(100%, 460px); }
.dd-menu.cols .o-all { grid-column: 1 / -1; }
.o {
  border: 0; background: transparent; border-radius: 10px; cursor: pointer; text-align: left; width: 100%;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 8px 10px;
}
.o:hover:not(:disabled), .o:focus-visible { background: var(--soft); outline: none; }
.o:disabled { opacity: .38; cursor: default; }
.o .ic { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; flex: none; }
.o .txt { min-width: 0; line-height: 1.2; }
.o .eb { display: block; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.o .nm { display: block; font-size: 16.5px; font-weight: 600; color: var(--ink); }
.o .n { min-width: 26px; height: 23px; border-radius: 99px; padding: 0 7px; background: var(--soft); color: var(--blue); font-size: 13px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.o[aria-selected="true"] { background: var(--blue); }
.o[aria-selected="true"] .nm, .o[aria-selected="true"] .eb { color: #FFFFFF !important; }
.o[aria-selected="true"] .ic, .o[aria-selected="true"] .n { background: #FFFFFF !important; }
.dd-menu.cols .o .nm { font-size: 15px; }
.dd-menu.cols .o .ic { width: 36px; height: 36px; }

/* ── Active line ── */
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 6px 2px; }
.count { font-size: 17.5px; font-weight: 700; color: var(--blue); font-variant-numeric: tabular-nums; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--blue); color: #FFFFFF; border-radius: 99px; padding: 5px 11px 5px 13px; font-size: 14.5px; font-weight: 600; cursor: pointer; }
.pill:hover { background: var(--blue-deep); }
.hint { font-size: 15.5px; color: var(--ink-soft); }
.clear { border: 0; background: none; color: var(--blue); font-weight: 600; cursor: pointer; text-decoration: underline; padding: 0; font-size: 15px; }

.main { display: grid; gap: 18px; margin-top: 10px; scroll-margin-top: 90px; }

/* ── First steps ── */
.path { border: 1.5px solid var(--blue); border-radius: 14px; overflow: hidden; }
.path-head { background: var(--blue); color: #FFFFFF; padding: 13px 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.path-head h2 { color: #FFFFFF; font-size: 20px; }
.path-head p { font-size: 14.5px; opacity: .9; }
.path-right { display: flex; align-items: center; gap: 12px; }
.meter { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.meter-bar { width: 100px; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .3); overflow: hidden; }
.meter-fill { height: 100%; background: #FFFFFF; border-radius: 99px; transition: width .3s; }
.toggle-steps { border: 1.5px solid rgba(255, 255, 255, .6); background: transparent; color: #FFFFFF; border-radius: 8px; padding: 4px 12px; font-size: 14.5px; font-weight: 600; cursor: pointer; }
.toggle-steps:hover { background: rgba(255, 255, 255, .15); }
.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.stage { padding: 14px 16px 16px; display: grid; gap: 8px; align-content: start; border-right: 1px solid var(--line); min-width: 0; }
.stage:last-child { border-right: 0; }
.stage-head { display: flex; align-items: center; gap: 10px; }
.stage-num { width: 32px; height: 32px; border-radius: 50%; background: var(--mars-light); color: var(--blue); flex: none; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.stage.complete .stage-num { background: var(--blue); color: #FFFFFF; }
.stage-title { font-weight: 700; color: var(--blue); font-size: 17.5px; line-height: 1.2; }
.stage-why { font-size: 14px; color: var(--ink-soft); }
.task { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-items: start; padding: 8px 11px; border-radius: 10px; background: var(--soft); }
.task input { width: 19px; height: 19px; margin: 2px 0 0; accent-color: var(--blue); cursor: pointer; grid-row: span 2; }
.task a { color: var(--ink); font-weight: 600; font-size: 15.5px; line-height: 1.3; text-decoration: none; }
.task a:hover { color: var(--blue); text-decoration: underline; }
.task small { font-size: 13px; color: var(--ink-soft); }
.task.done a { color: var(--ink-soft); text-decoration: line-through; }
.path-hint { border: 1.5px dashed var(--mars-light); border-radius: 12px; padding: 13px 16px; color: var(--ink-soft); font-size: 16px; display: flex; gap: 10px; align-items: center; }
.path-hint svg { color: var(--blue); flex: none; }
.path-hint b { color: var(--blue); }
.path-hint button { border: 0; background: none; color: var(--blue); font-weight: 600; text-decoration: underline; cursor: pointer; padding: 0; }

/* ── Results ── */
.results { display: grid; gap: 22px; }
.results.updated { animation: rise .3s ease-out; }
@keyframes rise { from { opacity: .35; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.topic { display: grid; gap: 10px; }
.topic-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.topic-head p { font-size: 15.5px; color: var(--ink-soft); }
.ticon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
.card { border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); transition: border-color .15s; min-width: 0; }
.card:hover { border-color: #B9B9DF; }
.card.is-done { background: var(--soft); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 14.5px; font-weight: 600; color: var(--ink-soft); }
.meta .fmt { display: inline-flex; align-items: center; gap: 7px; color: var(--blue); }
.badge { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--snk-light); color: var(--ink); }
.badge.new { background: var(--red); color: #FFFFFF; }
.summary { font-size: 16.5px; }
.who { font-size: 14.5px; color: var(--ink-soft); }
.who b { color: var(--ink); font-weight: 600; }
.apps { display: flex; flex-wrap: wrap; gap: 6px; }
.app-tag { border: 0; background: var(--wri-light); color: var(--ink); font-size: 14px; font-weight: 600; padding: 4px 11px; border-radius: 7px; cursor: pointer; }
.app-tag:hover { background: var(--wblue); color: #FFFFFF; }
.app-tag[aria-pressed="true"] { background: var(--blue); color: #FFFFFF; }
details { font-size: 15.5px; }
summary { cursor: pointer; font-weight: 600; color: var(--blue); font-size: 15px; list-style: none; display: inline-flex; align-items: center; gap: 6px; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "+"; font-weight: 700; width: 14px; }
details[open] summary::before { content: "\2013"; }
details ul { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 3px; }
.card-foot { margin-top: auto; padding-top: 4px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.open { display: inline-flex; align-items: center; gap: 6px; background: var(--blue); color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15.5px; padding: 9px 16px; border-radius: 10px; }
.open:hover { background: var(--blue-deep); }
.done-toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer; user-select: none; }
.done-toggle input { width: 19px; height: 19px; accent-color: var(--blue); margin: 0; cursor: pointer; }
.is-done .done-toggle { color: var(--blue); }
.empty { text-align: center; padding: 32px 16px; color: var(--ink-soft); border: 1.5px dashed var(--line); border-radius: 14px; display: grid; gap: 6px; justify-items: center; }
.help { border-top: 1px solid var(--line); padding-top: 16px; font-size: 14.5px; color: var(--ink-soft); display: grid; gap: 3px; }
.help b { color: var(--ink); }

@media (max-width: 760px) {
  .bar-wrap { position: static; }
  .main { scroll-margin-top: 10px; }
  .stage { border-right: 0; border-bottom: 1px solid var(--line); }
  .stage:last-child { border-bottom: 0; }
}
@media (max-width: 600px) {
  .bar { grid-template-columns: 1fr; gap: 8px; }
  .dd-btn, .search input { height: 58px; }
  .dd-menu, .dd:last-child .dd-menu, .dd-menu.cols { left: 0; right: auto; width: 100%; }
  .dd-menu.cols { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } html { scroll-behavior: auto; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="title-row">
    <h1>Find your training</h1>
    <div class="try" id="try"><span>Try:</span></div>
  </div>

  <div class="bar-wrap">
    <div class="bar" role="search">
      <label class="search" for="q">
        <svg class="s-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="What do you need help with?" aria-label="Search training" autocomplete="off">
        <button class="s-clear" type="button" id="q-clear" aria-label="Clear search" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </label>
      <div class="dd" id="dd-persona"></div>
      <div class="dd" id="dd-topic"></div>
      <div class="dd" id="dd-app"></div>
    </div>
    <div class="status" id="status-bar">
      <span class="count" id="count" aria-live="polite"></span>
      <div class="pills" id="pills"></div>
      <button class="clear" type="button" id="clear-all" hidden>Clear all</button>
    </div>
  </div>

  <main class="main" id="main" aria-label="Training results">
    <div id="path-slot"></div>
    <div class="results" id="results"></div>
    <footer class="help">
      <p><b>Links open in a new tab.</b> If a file doesn't open correctly, try the Microsoft Edge browser.</p>
      <p>Ticking a training as done is saved only in this browser. It's a personal checklist and isn't reported anywhere.</p>
    </footer>
  </main>
</div>

    const r = btn.getBoundingClientRect();
    const below = window.innerHeight - r.bottom - 14, above = r.top - 14;
    const want = Math.min(menu.scrollHeight, 440);

      menu.style.maxHeight = Math.max(150, Math.min(440, below)) + 'px';
    }
    // Keep the menu inside the frame horizontally.
    const vw = document.documentElement.clientWidth;
    let m = menu.getBoundingClientRect();
    if (m.right > vw - 8) { menu.style.left = 'auto'; menu.style.right = '0'; m = menu.getBoundingClientRect(); }
    if (m.left < 8) { menu.style.right = 'auto'; menu.style.left = (8 - r.left) + 'px'; menu.style.width = (vw - 16) + 'px'; }
  }
  function openMenu(g, focusWhich) {
    if (state.open && state.open !== g) closeMenu(false);
    const btn = document.querySelector(`[data-dd="${g}"]`), menu = $('menu-' + g);
    state.open = g;
    btn.setAttribute('aria-expanded', 'true');
    menu.hidden = false;
    placeMenu(g);
    const opts = [...menu.querySelectorAll('.o:not(:disabled)')];
    const target = focusWhich === 'last' ? opts[opts.length - 1] : (menu.querySelector('.o[aria-selected="true"]') || opts[0]);
    if (target) target.focus({ preventScroll: true });
  }
  function closeMenu(focusBtn) {
    const g = state.open; if (!g) return;
    state.open = null;
    const btn = document.querySelector(`[data-dd="${g}"]`), menu = $('menu-' + g);
    if (menu) menu.hidden = true;
    if (btn) { btn.setAttribute('aria-expanded', 'false'); if (focusBtn) btn.focus({ preventScroll: true }); }
  }

  function renderPath() {
    const p = personaOf(state.persona);
    if (!p.stages) {
      $('path-slot').innerHTML = `<div class="path-hint">${svg(ICON.everyone, 30)}<span><b>New to working across Mars and Kellanova?</b> <button type="button" data-open="persona">Choose your persona</button> to see which trainings to complete first, in order.</span></div>`;
      return;
    }
    const ids = p.stages.flatMap(s => s[1]);
    const n = ids.filter(id => done.has(id)).length;
    $('path-slot').innerHTML = `<section class="path" aria-labelledby="path-h">
      <div class="path-head">
        <div><h2 id="path-h">Your first steps as a ${esc(p.eyebrow)} ${esc(p.label)}</h2>
        <p>Start with these ${ids.length} trainings, left to right, and tick each one off when done.</p></div>
        <div class="path-right">
          <div class="meter" aria-live="polite"><div class="meter-bar"><div class="meter-fill" style="width:${n / ids.length * 100}%"></div></div><span>${n} of ${ids.length} done</span></div>
          <button class="toggle-steps" type="button" id="toggle-steps" aria-expanded="${state.stepsOpen}">${state.stepsOpen ? 'Hide' : 'Show'}</button>
        </div>
      </div>
      <div class="stages" ${state.stepsOpen ? '' : 'hidden'}>${p.stages.map(([key, list], si) => {
        const complete = list.every(id => done.has(id));
        return `<div class="stage${complete ? ' complete' : ''}">
          <div class="stage-head"><span class="stage-num" aria-hidden="true">${complete ? '\u2713' : si + 1}</span><span class="stage-title">${esc(STAGE[key].title)}</span></div>
          <p class="stage-why">${esc(STAGE[key].why)}</p>
          ${list.map(id => { const it = byId[id], d = done.has(id); return `<div class="task${d ? ' done' : ''}">
            <input type="checkbox" id="step-${id}" data-done="${id}" ${d ? 'checked' : ''} aria-label="Mark ${esc(it.title)} as done">
            <a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>
            <small>${FORMATS[it.fmt].name}${it.dur ? ' · ' + esc(it.dur) : ''}</small></div>`; }).join('')}
        </div>`;
      }).join('')}</div>
    </section>`;
  }

  function card(it) {
    const f = FORMATS[it.fmt], isDone = done.has(it.id);
    return `<article class="card${isDone ? ' is-done' : ''}" id="card-${it.id}">
      <div class="meta">
        <span class="fmt">${svg(FICON[it.fmt], 19)}${f.name}</span>
        ${it.dur ? `<span>${esc(it.dur)}</span>` : ''}
        ${it.region ? `<span class="badge">${esc(it.region)} only</span>` : ''}
        ${it.isNew ? `<span class="badge new">New</span>` : ''}
      </div>
      <h3>${esc(it.title)}</h3>
      <p class="summary">${esc(it.summary)}</p>
      <p class="who">For <b>${esc(it.who)}</b></p>
      ${it.apps.length ? `<div class="apps">${it.apps.map(a => `<button class="app-tag" type="button" data-app="${esc(a)}" aria-pressed="${state.app === a}" title="Show all ${esc(a)} training">${esc(a)}</button>`).join('')}</div>` : ''}
      ${it.covers ? `<details><summary>What's covered</summary><ul>${it.covers.map(c => `<li>${esc(c)}</li>`).join('')}</ul></details>` : ''}
      <div class="card-foot">
        <a class="open" href="${esc(it.url)}" target="_blank" rel="noopener">${f.verb}
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></a>
        <label class="done-toggle" for="done-${it.id}"><input type="checkbox" id="done-${it.id}" data-done="${it.id}" ${isDone ? 'checked' : ''}>${isDone ? 'Done' : 'Mark as done'}</label>
      </div>
    </article>`;
  }

  function renderResults(animate) {
    const list = ITEMS.filter(i => match(i));
    const p = personaOf(state.persona);
    $('count').textContent = `${list.length} ${list.length === 1 ? 'training' : 'trainings'}`;
    const pills = [];
    if (p.plural) pills.push(['persona', p.plural]);
    if (state.topic !== 'all') pills.push(['topic', topicOf(state.topic).name]);
    if (state.app !== 'all') pills.push(['app', state.app]);
    if (state.q.trim()) pills.push(['q', '\u201c' + state.q.trim() + '\u201d']);
    $('pills').innerHTML = pills.length
      ? pills.map(([g, label]) => `<button class="pill" type="button" data-remove="${g}" aria-label="Remove filter ${esc(label)}">${esc(label)}${X}</button>`).join('')
      : `<span class="hint">Showing everything. Use the filters above to narrow it down.</span>`;
    $('clear-all').hidden = pills.length < 2;
    $('q-clear').hidden = !state.q;

    const res = $('results');
    if (!list.length) {
      res.innerHTML = `<div class="empty"><p>No training matches this combination yet.</p><p>Remove a filter above, or clear them all.</p></div>`;
    } else {
      res.innerHTML = TOPICS.filter(t => list.some(i => i.topic === t.id)).map(t =>
        `<section class="topic" id="topic-${t.id}">
          <div class="topic-head">
            <span class="ticon" style="background:${t.bg};color:${t.fg}">${svg(ICON[t.id], 25)}</span>
            <h2>${esc(t.name)}</h2><p>${esc(t.blurb)}</p>
          </div>
          <div class="grid">${list.filter(i => i.topic === t.id).map(card).join('')}</div>
        </section>`).join('');
    }
    if (animate) { res.classList.remove('updated'); void res.offsetWidth; res.classList.add('updated'); }
  }

  function keepResultsInView() {
    const bar = document.querySelector('.bar-wrap');
    const barBottom = getComputedStyle(bar).position === 'sticky' ? bar.getBoundingClientRect().bottom : 0;
    const top = $('main').getBoundingClientRect().top;
    // Scroll so the results start just under the pinned bar (measured, not guessed).
    if (top < barBottom - 4 || top > window.innerHeight - 120) window.scrollBy({ top: top - barBottom - 8 });
  }

  function renderAll(animate) { renderDropdowns(); renderPath(); renderResults(animate); }
  function changed() { renderAll(true); keepResultsInView(); }
  function setQuery(v) { state.q = v; $('q').value = v; renderDropdowns(); renderResults(true); }

  // Close an open menu when the pointer goes down anywhere outside it (more reliable than click, incl. touch).
  document.addEventListener('pointerdown', e => {
    if (state.open && !e.target.closest('#dd-' + state.open)) closeMenu(false);
  });

  document.addEventListener('click', e => {
    const ddBtn = e.target.closest('[data-dd]');
    if (ddBtn) {
      const g = ddBtn.dataset.dd;
      state.open === g ? closeMenu(false) : openMenu(g);
      return;
    }
    const b = e.target.closest('[data-persona],[data-topic],[data-app]');
    if (b) {
      const g = 'persona' in b.dataset ? 'persona' : 'topic' in b.dataset ? 'topic' : 'app';
      const v = b.dataset[g];
      const fromMenu = b.classList.contains('o');
      state[g] = (!fromMenu && state[g] === v) ? 'all' : v;
      if (g === 'persona') store.set('techhub-role', state.persona);
      state.open = null;
      changed();
      if (fromMenu) { const btn = document.querySelector(`[data-dd="${g}"]`); if (btn) btn.focus({ preventScroll: true }); }
      return;
    }
    const op = e.target.closest('[data-open]');
    if (op) {
      window.scrollTo({ top: 0, behavior: 'auto' });
      requestAnimationFrame(() => openMenu(op.dataset.open));
      return;
    }
    const rm = e.target.closest('[data-remove]');
    if (rm) {
      const g = rm.dataset.remove;
      if (g === 'q') { state.q = ''; $('q').value = ''; } else state[g] = 'all';
      if (g === 'persona') store.set('techhub-role', 'all');
      changed(); return;
    }
    const t = e.target.closest('[data-try]');
    if (t) { setQuery(t.dataset.try); return; }
    if (e.target.closest('#q-clear')) { setQuery(''); $('q').focus(); return; }
    if (e.target.closest('#toggle-steps')) { state.stepsOpen = !state.stepsOpen; store.set('techhub-steps-open', state.stepsOpen); renderPath(); return; }
    if (e.target.id === 'clear-all') {
      state.persona = 'all'; state.topic = 'all'; state.app = 'all'; state.q = ''; $('q').value = '';
      store.set('techhub-role', 'all'); changed(); return;
    }
  });
  document.addEventListener('keydown', e => {
    // Arrow keys on a closed dropdown button open its menu.
    const ddBtn = e.target.closest && e.target.closest('[data-dd]');
    if (ddBtn && !state.open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault(); openMenu(ddBtn.dataset.dd, e.key === 'ArrowUp' ? 'last' : 'first'); return;
    }
    if (!state.open) return;
    if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); return; }
    const opts = [...$('menu-' + state.open).querySelectorAll('.o:not(:disabled)')];
    if (!opts.length) return;
    const i = opts.indexOf(document.activeElement);
    let next = null;
    if (e.key === 'ArrowDown') next = opts[(i + 1) % opts.length];
    else if (e.key === 'ArrowUp') next = opts[(i - 1 + opts.length) % opts.length];
    else if (e.key === 'Home') next = opts[0];
    else if (e.key === 'End') next = opts[opts.length - 1];
    if (next) { e.preventDefault(); next.focus(); }
  });
  // Tabbing away (including onto a different dropdown) closes the open menu.
  document.addEventListener('focusin', e => { if (state.open && !e.target.closest('#dd-' + state.open)) closeMenu(false); });
  window.addEventListener('resize', () => { if (state.open) placeMenu(state.open); });
  document.addEventListener('change', e => {
    const id = e.target.dataset && e.target.dataset.done;
    if (!id) return;
    e.target.checked ? done.add(id) : done.delete(id);
    store.set('techhub-done-v1', [...done]);
    renderPath(); renderResults(false);
  });
  let qTimer;
  $('q').addEventListener('input', e => {
    state.q = e.target.value; $('q-clear').hidden = !state.q;
    clearTimeout(qTimer); qTimer = setTimeout(() => { renderDropdowns(); renderResults(true); }, 120);
  });

  renderAll(false);
})();
</script>
</body>
</html>
