<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technology Learning Hub</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: white page. A Mars Blue search hero (big search with live suggestions, two rich dropdowns,
   quick-pick chips), then topic blocks of single-line "I need to…" guides. Coming-soon items fold away. */
:root{
  color-scheme: light;
  --bg:#FFFFFF;
  --ink:#3C3C3C;
  --ink-soft:#6B6B7A;
  --mars:#0000A0;
  --mars-deep:#00007A;
  --red:#F60B45;
  --wrig:#009EEA;
  --orange:#FF8B00;
  --mars-light:#BFBFF1;
  --kel-light:#FFCFF1;
  --wrig-light:#CCEDFF;
  --snack-light:#FFE8CC;
  --line:#E6E6F0;
  --panel:#F7F7FC;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-inline:clamp(16px,4vw,36px);padding-block:20px 48px}
:focus-visible{outline:3px solid var(--wrig);outline-offset:2px}

/* Hero */
.hero{position:relative;z-index:3;background:var(--mars);color:#FFFFFF;border-radius:24px;padding:clamp(22px,4vw,36px);isolation:isolate}
.hero .deco{position:absolute;inset:0;border-radius:inherit;overflow:hidden;z-index:-1;pointer-events:none}
.hero .deco i{position:absolute;border-radius:50%;opacity:.9}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mars-light);display:flex;gap:10px;align-items:center}
.dots{display:inline-flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:2px;display:block}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,4.6vw,3rem);line-height:1;margin:10px 0 10px;letter-spacing:-.02em;color:#FFFFFF}
.hero .ask{margin:0 0 18px;font-size:1.08rem;color:#E2E2FA;max-width:52ch}

.search{position:relative}
.search svg.mag{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:var(--mars)}
.search input{width:100%;font:inherit;font-size:1.15rem;color:var(--ink);background:#FFFFFF;border:3px solid transparent;border-radius:16px;padding:17px 120px 17px 56px;box-shadow:0 14px 34px -18px rgba(0,0,0,.55);transition:border-color .15s,box-shadow .2s}
.search input:focus{outline:none;border-color:var(--wrig);box-shadow:0 0 0 6px rgba(0,158,234,.25),0 14px 34px -18px rgba(0,0,0,.55)}
.search input::placeholder{color:#8A8A99}
.search .count{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:.8rem;font-weight:700;color:var(--mars);background:var(--wrig-light);border-radius:999px;padding:5px 11px;font-variant-numeric:tabular-nums;white-space:nowrap}

.controls{margin-top:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dd{position:relative;min-width:0}
.dd-btn{width:100%;font:inherit;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:10px 14px 10px 10px;border-radius:14px;border:2px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#FFFFFF;cursor:pointer;transition:background .15s,border-color .15s}
.dd-btn:hover,.dd.open .dd-btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.6)}
.dd-btn.set{background:#FFFFFF;color:var(--mars);border-color:#FFFFFF}
.dd-btn .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.16);color:#FFFFFF;font-weight:800;font-size:.85rem}
.dd-btn.set .ic{color:#FFFFFF}
.dd-btn small{display:block;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.dd-btn b{display:block;font-size:1rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-btn .chev{transition:transform .2s}
.dd.open .dd-btn .chev{transform:rotate(180deg)}
.dd-menu{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:10;list-style:none;margin:0;padding:6px;background:#FFFFFF;color:var(--ink);border-radius:14px;box-shadow:0 22px 48px -18px rgba(0,0,60,.45),0 0 0 1px var(--line);max-height:340px;overflow:auto;transform-origin:top;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.dd-menu li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer}
.dd-menu li:hover,.dd-menu li.active{background:var(--panel)}
.dd-menu li[aria-selected="true"]{background:var(--wrig-light)}
.dd-menu li b{display:block;font-size:.95rem;color:var(--mars);line-height:1.25}
.dd-menu li small{display:block;font-size:.78rem;color:var(--ink-soft)}
.dd-menu .n{font-size:.75rem;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.dd-menu .tick{color:var(--mars)}
.sw{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#FFFFFF;font-weight:800;font-size:.75rem;flex:none}

.chips{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips span{font-size:.82rem;color:var(--mars-light);margin-right:2px}
.chips button{font:inherit;font-size:.86rem;font-weight:600;color:#FFFFFF;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:5px 13px;cursor:pointer;transition:background .15s,transform .15s}
.chips button:hover{background:rgba(255,255,255,.24);transform:translateY(-1px)}
.chips button[aria-pressed="true"]{background:#FFFFFF;color:var(--mars)}

.hint{margin:16px 2px 0;font-size:.92rem;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;min-height:1.4em}
.hint a{color:var(--mars);font-weight:700;text-decoration:none}
.hint a:hover{text-decoration:underline}
.hint button{font:inherit;font-weight:700;color:var(--mars);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}

/* List */
.grid{margin-top:18px;columns:2;column-gap:20px}
.block{border:1px solid var(--line);border-radius:16px;padding:16px 16px 10px;min-width:0;break-inside:avoid;margin-bottom:20px}
.b-head{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.b-head .si{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mars);flex:none}
.b-head h2{font-family:var(--display);font-size:1.18rem;line-height:1.15;margin:0;color:var(--mars)}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 8px;border-radius:10px;text-decoration:none;color:inherit;transition:background .12s}
.rows li+li .row{border-top:1px solid var(--line);border-radius:0}
.rows li+li .row:hover{border-radius:10px}
a.row:hover{background:var(--panel)}
.row b{display:block;font-weight:700;font-size:.98rem;line-height:1.3;color:var(--mars)}
.row small{display:block;font-size:.8rem;color:var(--ink-soft);margin-top:1px}
.row .go{color:var(--mars);display:grid;transition:transform .15s}
a.row:hover .go{transform:translateX(3px)}
.new{font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--kel-light);color:#9A0030;margin-left:6px;vertical-align:2px}
.watch{display:flex;flex-wrap:wrap;gap:6px 10px;padding:0 8px 10px;font-size:.8rem;color:var(--ink-soft)}
.watch a{color:var(--mars);font-weight:600;text-decoration:none}
.watch a:hover{text-decoration:underline}
details.soon{margin:4px 0;border-top:1px dashed var(--line);padding:8px 8px 2px}
details.soon summary{cursor:pointer;font-size:.86rem;font-weight:600;color:var(--ink-soft);list-style:none;display:flex;gap:6px;align-items:center}
details.soon summary::-webkit-details-marker{display:none}
details.soon summary::before{content:"+";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--snack-light);color:#8A4A00;font-weight:800;font-size:.85rem}
details.soon[open] summary::before{content:"–"}
details.soon ul{list-style:none;margin:6px 0 4px;padding:0 0 0 24px;display:grid;gap:4px;font-size:.88rem;color:var(--ink)}
mark{background:var(--snack-light);color:inherit;border-radius:3px;padding:0 2px}

.empty{margin-top:24px;padding:28px;text-align:center;border:1.5px dashed var(--line);border-radius:16px;color:var(--ink-soft)}
.empty b{display:block;color:var(--mars);font-size:1.05rem;margin-bottom:4px}
.empty button{font:inherit;font-weight:700;color:var(--mars);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.note{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font-size:.84rem;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

@media (max-width:800px){ .grid{columns:1} }
@media (max-width:560px){ .controls{grid-template-columns:1fr} .search input{padding-right:16px;font-size:1rem} .search .count{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body style="margin:0">
<div class="wrap">
  <section class="hero" aria-labelledby="hubTitle">
    <div class="deco" aria-hidden="true">
      <i style="width:220px;height:220px;right:-70px;top:-90px;background:var(--wrig)"></i>
      <i style="width:90px;height:90px;right:120px;top:-40px;background:var(--red)"></i>
      <i style="width:46px;height:46px;right:60px;top:110px;background:var(--orange)"></i>
    </div>
    <h1 id="hubTitle">What do you need to do today?</h1>
    <p class="ask">Search, or tell us who you are and which app you're using.</p>

    <div class="search">
      <svg class="mag" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search guides" autocomplete="off" aria-label="Search guides">
      <span class="count" id="count" aria-live="polite"></span>
    </div>

    <div class="controls">
      <div class="dd" id="ddRole"></div>
      <div class="dd" id="ddApp"></div>
    </div>

    <div class="chips" id="chips"><span>Popular:</span></div>
  </section>

  <p class="hint" id="hint" aria-live="polite"></p>
  <main class="grid" id="main"></main>
  <div class="empty" id="empty" hidden><b>No guides match that yet</b>Try another word, or <button type="button" id="reset">show everything</button>.</div>

  <footer class="note">
    <span>If a link does not open correctly, please try the Edge browser.</span>
    <span>New guides are added as more tools change. Check back often.</span>
  </footer>
</div>

const ICONS = {
  key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M14 9l2 2"/>',
  shield:'<path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  laptop:'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
  cart:'<path d="M3 4h2l2.5 11h11L21 7H6.5"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/>',
  receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  wifi:'<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/>',
  user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/>',
  grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  team:'<circle cx="12" cy="7" r="3"/><circle cx="5" cy="14" r="2"/><circle cx="19" cy="14" r="2"/><path d="M7 21c0-2.8 2.2-5 5-5s5 2.2 5 5"/>'
};
const svg = (k,s=18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;
const chev = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
const down = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
const tick = '<svg class="tick" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';

const POPULAR = ["Locked out","Okta","Secondary mailbox","Concur","Wi-Fi","Cloud PC"];
const ROLE_META = {
  all:{sub:"See every guide", sw:"var(--mars)", ic:"grid"},
  ma:{sub:"Using Kellanova tools", sw:"var(--mars)", ic:"user"},
  ka:{sub:"Using Mars tools", sw:"var(--red)", ic:"user"},
  ml:{sub:"Leading Kellanova direct reports", sw:"var(--mars)", ic:"team"},
  kl:{sub:"Leading Mars direct reports", sw:"var(--red)", ic:"team"}
};

const state = {role:"all", app:"", q:""};
try{ const r = localStorage.getItem("tlh-role2"); if(r && ROLES.some(x=>x.id===r)) state.role = r; }catch(e){}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl = t => { t = esc(t); if(!state.q) return t;
  const words = state.q.split(/\s+/).map(w=>w.toLowerCase().replace(/[^a-z0-9@]+/g,"")).filter(w=>w.length>1);
  if(!words.length) return t;
  const pat = words.map(w=>w.split("").map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("[-\\s.]?")).join("|");
  return t.replace(new RegExp("("+pat+")","ig"),"<mark>$1</mark>"); };
const text = g => [g.need,g.title,g.desc,g.who,g.format,...g.apps.map(k=>APPS[k].name)].join(" ").toLowerCase();
const roleOk = (g,r=state.role) => r==="all" || g.roles.includes(r);
/* forgiving search: ignores hyphens, spaces and punctuation ("wifi" = "Wi-Fi"), matches every word in any order, plus a few everyday synonyms */
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9@]+/g,"");
const ALIAS = {wireless:"wifi", internet:"wifi", vdi:"cloudpc", virtualpc:"cloudpc", mfa:"authenticator", twofactor:"authenticator", email:"mailbox", expenses:"expense"};
const matches = (g,q) => { const t = norm(text(g)), whole = norm(q);
  if(whole && (t.includes(whole) || (ALIAS[whole] && t.includes(ALIAS[whole])))) return true;
  const words = q.split(/\s+/).map(norm).filter(w=>w.length>=3);
  return words.length>0 && words.every(w => t.includes(w) || (ALIAS[w] && t.includes(ALIAS[w]))); };
const pass = g => roleOk(g) && (!state.app || g.apps.includes(state.app)) && (!state.q || matches(g, state.q));
const ready = g => g.status!=="soon" && g.url;
const roleLabel = r => { const t = ROLES.find(x=>x.id===r).label.replace(/^A /,""); return t.charAt(0).toUpperCase()+t.slice(1); };

/* ---------- dropdown component ---------- */
function makeDropdown(el, cfg){
  let open = false, active = -1;
  function opts(){ return cfg.options(); }
  function draw(){
    const cur = opts().find(o=>o.value===cfg.get()) || opts()[0];
    el.className = "dd" + (open ? " open" : "");
    el.innerHTML = `<button type="button" class="dd-btn${cfg.get()&&cfg.get()!=="all"?" set":""}" id="${el.id}-btn" aria-haspopup="listbox" aria-expanded="${open}">
        <span class="ic" ${cfg.get()&&cfg.get()!=="all"&&cur.color?`style="background:${cur.color}"`:""}>${cur.icon}</span>
        <span><small>${cfg.label}</small><b>${esc(cur.btn || cur.label)}</b></span>${down}</button>
      ${open ? `<ul class="dd-menu" role="listbox" aria-label="${cfg.label}">${opts().map((o,i)=>`<li role="option" id="${el.id}-o${i}" data-i="${i}" aria-selected="${o.value===cfg.get()}" class="${i===active?"active":""}">
          <span class="sw" style="background:${o.color}">${o.icon}</span><span><b>${esc(o.label)}</b>${o.sub?`<small>${esc(o.sub)}</small>`:""}</span>${o.value===cfg.get()?tick:`<span class="n">${o.n ?? ""}</span>`}</li>`).join("")}</ul>` : ""}`;
    if(open && active>=0){ const a = el.querySelector(".dd-menu .active"); a && a.scrollIntoView({block:"nearest"}); }
  }
  function pick(i){ const o = opts()[i]; if(!o) return; cfg.set(o.value); close(true); }
  function close(focus){ open=false; active=-1; draw(); if(focus) el.querySelector(".dd-btn").focus(); }
  el.addEventListener("click", e=>{
    e.inDropdown = true;
    const li = e.target.closest("li[data-i]"); if(li){ pick(+li.dataset.i); return; }
    if(e.target.closest(".dd-btn")){ open=!open; active = open ? Math.max(0, opts().findIndex(o=>o.value===cfg.get())) : -1; closeOthers(el); draw(); }
  });
  el.addEventListener("keydown", e=>{
    const n = opts().length;
    if(!open && (e.key==="ArrowDown"||e.key==="Enter"||e.key===" ") && e.target.closest(".dd-btn")){ e.preventDefault(); open=true; active=Math.max(0, opts().findIndex(o=>o.value===cfg.get())); closeOthers(el); draw(); return; }
    if(!open) return;
    if(e.key==="ArrowDown"){ e.preventDefault(); active=(active+1)%n; draw(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); active=(active-1+n)%n; draw(); }
    else if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(active); }
    else if(e.key==="Escape"||e.key==="Tab"){ close(e.key==="Escape"); }
  });
  el._close = ()=>{ if(open){ open=false; draw(); } };
  el._draw = draw;
  draw();
}
const DDS = [];
function closeOthers(keep){ DDS.forEach(d=>{ if(d!==keep) d._close(); }); }
document.addEventListener("click", e=>{ if(!e.inDropdown) closeOthers(null); });

/* ---------- list ---------- */
function row(g){
  const extra = g.extras ? `<div class="watch">${esc(g.extras.label)}: ${g.extras.items.map(x=>`<a href="${x.url}" target="_blank" rel="noopener">${esc(x.t)}</a>`).join(" · ")}</div>` : "";
  return `<li><a class="row" href="${g.url}" target="_blank" rel="noopener" title="${esc(g.desc)}">
    <span><b>${hl(g.need)}${g.status==="new"?'<span class="new">New</span>':""}</b><small>${hl(g.title)} · ${esc(g.time)}</small></span>
    <span class="go">${chev}</span></a>${extra}</li>`;
}

function render(){
  const list = GUIDES.filter(pass);
  let html = "", live = 0;
  for(const s of SECTIONS){
    const items = list.filter(g=>g.cat===s.id);
    const now = items.filter(ready).sort((a,b)=>(a.status==="new"?0:1)-(b.status==="new"?0:1));
    const soon = items.filter(g=>!ready(g));
    if(!items.length) continue;
    live += now.length;
    html += `<section class="block" aria-labelledby="h-${s.id}">
      <div class="b-head"><span class="si" style="background:${s.tint}">${svg(s.ico)}</span><h2 id="h-${s.id}">${s.title}</h2></div>
      ${now.length ? `<ul class="rows">${now.map(row).join("")}</ul>` : ""}
      ${soon.length ? `<details class="soon"${state.q?" open":""}><summary>${soon.length} more coming soon</summary><ul>${soon.map(g=>`<li>${hl(g.need)}</li>`).join("")}</ul></details>` : ""}
    </section>`;
  }
  document.getElementById("main").innerHTML = html;
  document.getElementById("empty").hidden = !!html;
  document.getElementById("count").textContent = `${live} guide${live===1?"":"s"}`;

  const start = GUIDES.find(g=>g.start);
  const filtered = state.q || state.role!=="all" || state.app;
  const bits = [];
  if(state.role!=="all") bits.push(`for <b style="color:var(--mars)">${esc(roleLabel(state.role).replace(/^Legacy/,"legacy"))}s</b>`);
  if(state.app) bits.push(`using <b style="color:var(--mars)">${esc(APPS[state.app].name)}</b>`);
  if(state.q) bits.push(`matching “${esc(state.q)}”`);
  document.getElementById("hint").innerHTML = filtered
    ? `<span><b style="color:var(--mars)">${live}</b> guide${live===1?"":"s"} ready ${bits.join(" ")}</span><button type="button" id="clear">Show everything</button>`
    : `<span>New here?</span><a href="${start.url}" target="_blank" rel="noopener">Start with Cross-Company Access: Start Here →</a>`;

  document.querySelectorAll("#chips button").forEach(b=>b.setAttribute("aria-pressed", state.q.toLowerCase()===b.dataset.q.toLowerCase()));
  DDS.forEach(d=>d._draw());
}

/* ---------- wire up ---------- */
const ddRole = document.getElementById("ddRole"), ddApp = document.getElementById("ddApp");
makeDropdown(ddRole, {
  label:"I am",
  get:()=>state.role,
  set:v=>{ state.role=v; try{ localStorage.setItem("tlh-role2", v); }catch(e){} render(); },
  options:()=>ROLES.map(r=>({value:r.id, label:roleLabel(r.id), btn:"a "+roleLabel(r.id).replace(/^Legacy/,"legacy"), sub:ROLE_META[r.id].sub, color:ROLE_META[r.id].sw, icon:svg(ROLE_META[r.id].ic,16),
    n: GUIDES.filter(g=>ready(g) && roleOk(g,r.id)).length}))
});
makeDropdown(ddApp, {
  label:"App",
  get:()=>state.app,
  set:v=>{ state.app=v; render(); },
  options:()=>[{value:"", label:"Any app", sub:"Every tool", color:"var(--mars)", icon:svg("grid",16), n:""}]
    .concat(Object.entries(APPS).sort((a,b)=>a[1].name.localeCompare(b[1].name))
      .map(([k,a])=>({value:k, label:a.name, color:a.color, icon:a.logo?`<img src="${a.logo}" alt="" style="width:100%;height:100%;border-radius:9px;background:#fff">`:a.ab,
        n: GUIDES.filter(g=>g.apps.includes(k) && roleOk(g)).length}))
      .filter(o=>o.n>0))
});
DDS.push(ddRole, ddApp);

const chips = document.getElementById("chips");
chips.insertAdjacentHTML("beforeend", POPULAR.map(p=>`<button type="button" data-q="${esc(p)}" aria-pressed="false">${esc(p)}</button>`).join(""));
const q = document.getElementById("q");
chips.addEventListener("click", e=>{ const b=e.target.closest("button[data-q]"); if(!b) return; const same = state.q.toLowerCase()===b.dataset.q.toLowerCase(); q.value = same ? "" : b.dataset.q; state.q = q.value; render(); });
q.addEventListener("input", ()=>{ state.q = q.value.trim(); render(); });

function clearAll(){ state.q=""; state.app=""; state.role="all"; q.value=""; try{ localStorage.setItem("tlh-role2","all"); }catch(e){} render(); }
document.addEventListener("click", e=>{ if(e.target.id==="clear" || e.target.id==="reset") clearAll(); });

/* typewriter placeholder: cycles real tasks while the box is empty and unfocused */
(function(){
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const lines = ["set up Okta Verify","reset my Mars password","approve a KBuy requisition","connect to Wi-Fi at a Mars office","get a Windows 365 Cloud PC","request my Mars secondary mailbox"];
  if(reduce){ q.placeholder = "Try: " + lines[0]; return; }
  let li = 0, ci = 0, dir = 1, wait = 0;
  setInterval(()=>{
    if(document.activeElement===q || q.value){ q.placeholder = "Search guides, apps or problems"; return; }
    if(wait>0){ wait--; return; }
    const full = lines[li];
    ci += dir;
    q.placeholder = "I need to " + full.slice(0, ci) + (dir>0 ? "▍" : "");
    if(dir>0 && ci>=full.length){ dir=-1; wait=22; }
    else if(dir<0 && ci<=0){ dir=1; li=(li+1)%lines.length; wait=4; }
  }, 55);
})();

render();
</script>
